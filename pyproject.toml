[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-rl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "gymnasium>=0.29,<2", "stable-baselines3>=2.3,<3", "torch>=2.2", "scikit-learn>=1.4", "streamlit>=1.35", "plotly>=5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
kairos = "kairos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
